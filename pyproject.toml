[project]
name = "gentest"
version = "0.1.0"
description = "Evolutionary Metamorphic Testing Framework for Quantum Compilers (MQT-CC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.0.0",
    "qiskit-aer>=0.18.0",
    "mqt.core>=4.1.0",
    "sympy>=1.13.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "networkx>=3.0",
    "astunparse>=1.6.3",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
